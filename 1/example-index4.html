<!DOCTYPE html>
<html>

<head>
    <title> Sections </title>
</head>

<body>
    <h1> Inline and block-level contents </h1>
        
    <p>
        This is an inline <span>element</span> with a link to
        <a href="https://example.com">Example Website</a> and an image:
        <img src="https://via.placeholder.com/150" alt="Alternative" />
    </p>

    <div>
        <div>This is a block-level <div>element</div>
        </div>
        <div>with a link to
            <a href="https://example.com">Example Website</a>
        </div>
        <div>
            And an image:
            <img src="https://via.placeholder.com/150" alt="Alternative">
        </div>
    </div>

</body>

</html>
