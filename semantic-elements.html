<!DOCTYPE html>
<html lang="bg">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пример със семантични елементи</title>
</head>

<body>

    <header>
        <h1>Заглавие на страницата</h1>
    </header>

    <nav>
        <ul>
            <li><a href="#">Начало</a></li>
            <li><a href="#">За нас</a></li>
            <li><a href="#">Контакти</a></li>
        </ul>
    </nav>

    <section>
        <header>
            <h2>Заглавие на секцията</h2>
        </header>

        <article>
            <h3>Заглавие на статия</h3>
            <p>Това е примерна статия с текст.</p>
        </article>

        <footer>
            <p>Автор на статията: Иван Иванов</p>
        </footer>
    </section>

    <aside>
        <p>Това е странична лента с допълнителна информация.</p>
    </aside>

    <footer>
        <p>Авторски права &copy; 2024</p>
    </footer>

</body>

</html>
